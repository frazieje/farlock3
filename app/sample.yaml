sample:
  description: FARLock v3 Matter over Thread door lock
  name: farlock3
common:
  sysbuild: true
  build_only: true
  platform_allow:
    - farlock3
    - nrf52840dk/nrf52840
  integration_platforms:
    - farlock3
  tags:
    - sysbuild
    - matter
tests:
  app.farlock3.debug: {}
  app.farlock3.release:
    extra_args:
      - FILE_SUFFIX=release
  app.farlock3.schedules:
    extra_args:
      - EXTRA_CONF_FILE=schedules.conf
  app.farlock3.simulated:
    extra_args:
      - CONFIG_FARLOCK3_LOCK_SIMULATED=y
